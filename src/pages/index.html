<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Marca de Café</title>

  <link rel="stylesheet" href="../styles/main.css" />
  <link rel="stylesheet" href="../styles/pages/index.css" />
  <script src="../scripts/layout.js" defer></script>
</head>
<body>

  <header id="navbar"></header>

  <main>
    <section class="hero">
      <div class="hero__content">
        <div class="hero__image-container">
          <img src="../../public/images/brand/logo-sem-presente.png" alt="Logo do Café Matteo" class="hero__logo"/>
        </div>
        <h3>Um presente de Deus em forma de café</h3>
        <h4>100% Arábica | Mundo Novo & Arará.</h4>
      </div>
    </section>

    <section class="differentials">
      <h2>O que torna o Café Matteo especial</h2>
      <p>Café em grãos, moído e drip coffee.</p>
    </section>

    <section class="varieties">
      <h2>Conheça nossas variedades</h2>
      <p>Mundo Novo</p>
      <p>Arará</p>
    </section>
  </main>

  <footer id="footer"></footer>

</body>
</html>
